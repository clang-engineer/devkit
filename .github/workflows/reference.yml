name: Reference validation
on:
  push:
    paths:
      - 'reference/**'
      - 'cmdtreemap/**'
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/reference.yml'
  pull_request:
    paths:
      - 'reference/**'
      - 'cmdtreemap/**'
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'Makefile'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: cmdtreemap/go.mod
      - name: Validate and test cmdtreemap and shared explorer
        run: |
          make test
          cd cmdtreemap
          go vet ./...
          go build -o /tmp/cmdtreemap .
      - name: Validate cheatsheet catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('reference/cheatsheets')
          data = json.loads(Path('reference/catalog.json').read_text())['cheatsheets']
          items = [item for group in data['groups'] for item in group['items']] + data.get('guides', [])
          assert len({item['slug'] for item in items}) == len(items)
          assert all((root / item['file']).is_file() for item in items)
          PY
