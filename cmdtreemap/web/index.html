<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cmdtreemap</title>
  <style>
    :root { color-scheme: dark; --bg: #17191f; --panel: #20232b; --line: #3a3f4b; --text: #e5e7eb; --muted: #9aa1ad; --accent: #98c379; --orange: #d19a66; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
    main { width: min(1180px, calc(100% - 2rem)); margin: 2rem auto; }
    h1 { margin-bottom: .25rem; }
    h1, h2, h3 { line-height: 1.25; }
    #status { color: var(--muted); margin-top: 0; }
    #search { width: 100%; padding: .75rem .9rem; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text); font: inherit; }
    .layout { display: grid; grid-template-columns: minmax(260px, .8fr) minmax(0, 1.5fr); gap: 1.5rem; margin-top: 1.5rem; align-items: start; }
    #tree, #detail { min-width: 0; }
    #detail { padding: 1.25rem; border-left: 1px solid var(--line); }
    .tree-category, .tree-group { border-top: 1px solid var(--line); }
    summary { cursor: pointer; padding: .65rem 0; color: var(--orange); font-weight: 700; }
    summary span { float: right; color: var(--muted); font-size: .85rem; font-weight: 400; }
    .tree-group summary { padding-left: .8rem; color: var(--muted); font-size: .9rem; }
    ul { margin: 0; padding: 0; list-style: none; }
    .tree-item { width: 100%; padding: .55rem .7rem .55rem 1.35rem; border: 0; border-left: 2px solid transparent; background: transparent; color: var(--text); text-align: left; cursor: pointer; }
    .tree-item:hover, .tree-item:focus-visible, .tree-item.is-selected { border-left-color: var(--accent); background: var(--panel); }
    .tree-item strong, .tree-item small { display: block; }
    .tree-item small, .muted, .eyebrow { color: var(--muted); }
    .tree-item small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .eyebrow { margin: 0 0 .4rem; font-size: .85rem; }
    #detail h2 span { color: var(--muted); }
    .facts { margin: 1.5rem 0; }
    .facts div { padding: .8rem 0; border-top: 1px solid var(--line); }
    .facts dt { color: var(--orange); font-weight: 700; }
    .facts dd { margin: .2rem 0 0; }
    .detail-section { margin-top: 1.5rem; }
    .detail-section h3 { color: var(--orange); font-size: 1rem; }
    .tldr-list { list-style: decimal; padding-left: 1.4rem; }
    code { color: var(--accent); }
    a { color: #61afef; }
    .error { color: #e06c75; }
    @media (max-width: 767px) {
      main { width: min(100% - 1rem, 680px); margin: 1rem auto; }
      .layout { display: block; }
      #detail { margin-top: 1.5rem; padding: 1rem 0 0; border-top: 1px solid var(--line); border-left: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>cmdtreemap</h1>
    <p id="status">데이터를 불러오는 중...</p>
    <input id="search" type="search" placeholder="도구, 관계, 문제를 검색..." autocomplete="off">
    <div class="layout">
      <nav id="tree" aria-label="명령어 관계 tree"></nav>
      <article id="detail" aria-live="polite" hidden></article>
    </div>
  </main>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch('cmdtreemap.wasm'), go.importObject)
      .then((result) => go.run(result.instance))
      .catch(() => {});
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
