<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cmdtreemap</title>
  <link rel="stylesheet" href="app.css">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #17191f; color: #e5e7eb; }
    main { width: min(1180px, calc(100% - 2rem)); margin: 2rem auto; }
    h1 { margin-bottom: 1rem; font: 700 2rem/1.25 system-ui, sans-serif; }
    @media (max-width: 767px) { main { width: min(100% - 1rem, 680px); margin: 1rem auto; } }
  </style>
</head>
<body>
  <main>
    <h1>cmdtreemap</h1>
    <div id="cmdtreemap-root"></div>
  </main>
  <script src="wasm_exec.js"></script>
  <script>
    window.CMDTREEMAP_BASE = './';
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch('cmdtreemap.wasm'), go.importObject)
      .then((result) => go.run(result.instance))
      .catch(() => {});
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
